[package]
name = "lumina-reader"
version = "0.1.0"
description = "Universal Digital Reading Suite"
authors = ["Lumina Team"]
edition = "2021"

[lib]
name = "lumina_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "9.1.1"
quick-xml = "0.42.0"
rusqlite = { version = "0.32", features = ["bundled"] }
