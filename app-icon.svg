<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" filter="url(#glow)" />

  <!-- Open Book Base -->
  <!-- Left Page -->
  <path d="M 120 180 C 180 160, 230 180, 256 200 L 256 360 C 230 340, 180 320, 120 340 Z" fill="url(#pageGrad)" opacity="0.95" />
  <!-- Right Page -->
  <path d="M 392 180 C 332 160, 282 180, 256 200 L 256 360 C 282 340, 332 320, 392 340 Z" fill="url(#pageGrad)" opacity="0.95" />

  <!-- Book Spine Center Glow -->
  <path d="M 256 200 L 256 365" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Page Lines (Left) -->
  <line x1="150" y1="225" x2="230" y2="235" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
  <line x1="150" y1="255" x2="230" y2="265" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
  <line x1="150" y1="285" x2="210" y2="295" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

  <!-- Page Lines (Right) -->
  <line x1="282" y1="235" x2="362" y2="225" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
  <line x1="282" y1="265" x2="362" y2="255" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
  <line x1="282" y1="295" x2="342" y2="285" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

  <!-- Lumina Star / Sparkle above spine -->
  <g transform="translate(256, 140)" filter="url(#glow)">
    <path d="M 0 -24 Q 0 0, 24 0 Q 0 0, 0 24 Q 0 0, -24 0 Q 0 0, 0 -24 Z" fill="url(#accentGrad)" />
  </g>
</svg>
